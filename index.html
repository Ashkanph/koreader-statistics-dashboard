<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Explore your KOReader reading statistics in the browser. Your data never leaves your device."
    />
    <title>KOReader Statistics Dashboard</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash (see src/lib/theme.ts).
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}

      // Flex gap arrived in Chrome 84 and Safari 14.1. Without it, index.css spaces flex items
      // with margins instead. ES5 on purpose: this script isn't transpiled.
      var probe = document.createElement('div')
      probe.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute'
      probe.appendChild(document.createElement('div'))
      probe.appendChild(document.createElement('div'))
      document.documentElement.appendChild(probe)
      if (probe.scrollHeight !== 1) document.documentElement.className += ' no-flex-gap'
      document.documentElement.removeChild(probe)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
